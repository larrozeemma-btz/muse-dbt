name: muse
version: "1.0.0"
config-version: 2

profile: muse

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

clean-targets: ["target", "dbt_packages", "logs"]

vars:
  # MUSE scoring weights (slide 4). Must sum to 1 — enforced by a singular test.
  muse_weight_genre: 0.5
  muse_weight_history: 0.3
  muse_weight_popularity: 0.2
  # Size of the playlist returned to each listener (slide 3: "return top five").
  muse_top_n: 5
  # Discovery mode: do not recommend tracks the listener has already played.
  muse_exclude_listened_tracks: true
  # Engagement points per event type, used to build the listening-history signal.
  muse_event_points:
    play: 1
    repeat: 2
    add_to_playlist: 3
    like: 3
    skip: -1
  # Candidate generation (retrieval stage, before scoring).
  muse_candidate_genres_per_user: 5     # listener's top genres to retrieve from
  muse_candidates_per_genre: 50         # most popular tracks taken per genre
  muse_candidate_artists_per_user: 5    # "more from artists you love"
  muse_candidates_per_artist: 20
  muse_trending_candidates: 50          # global fallback, also covers cold start
  # Sessionisation: a gap longer than this starts a new listening session.
  muse_session_timeout_minutes: 30
  # Marketing measurement
  muse_eur_to_usd: 1.087                 # finance's planning FX rate
  muse_plg_lookback_days: 30             # attribution window before a PLG conversion
  muse_enterprise_lookback_days: 365     # attribution window before an opportunity
  muse_time_decay_half_life_days: 7      # time-decay model: a touch 7 days earlier counts half
  muse_activation_plays: 10              # "activated" = this many plays ...
  muse_activation_window_days: 7         # ... within this many days of signup
  # Marketing reports stop at the last complete week with full data
  muse_reporting_cutoff_date: "2026-09-13"
  # Last day of data — used as "today" for churn / recency metrics.
  muse_as_of_date: "2026-09-30"

models:
  muse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: core
      recommendations:
        +schema: recommendations
      analytics:
        +schema: analytics
      marketing:
        +schema: marketing
      presentation:
        +schema: presentation

seeds:
  muse:
    +schema: reference
