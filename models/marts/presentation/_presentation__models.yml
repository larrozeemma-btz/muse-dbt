version: 2

models:
  - name: presentation_top5
    description: Reproduction of the deck's demo top five (slide 8) from the fictional dataset.
    columns:
      - name: recommendation_rank
        data_tests: [unique, not_null]

unit_tests:
  - name: test_midnight_drive_scores_91_6
    description: 'Slide 5 worked example — 96 × 0.5 + 92 × 0.3 + 80 × 0.2 = 91.6'
    model: presentation_top5
    overrides:
      vars: {muse_weight_genre: 0.5, muse_weight_history: 0.3, muse_weight_popularity: 0.2, muse_top_n: 5}
    given:
      - input: ref('presentation_song_scores')
        rows:
          - {track_title: Midnight Drive, genre_name: Synth Pop, genre_match_score: 96, listening_history_score: 92, popularity_score: 80}
    expect:
      rows:
        - {recommendation_rank: 1, track_title: Midnight Drive, recommendation_score: 91.6}
