version: 2

sources:
  - name: spotify
    schema: raw
    description: Public Spotify Tracks Dataset (Hugging Face, BSD licence), loaded untouched by `scripts/load_raw_data.py`.
    tables:
      - name: spotify_tracks
        description: >
          One row per track × genre (a track listed under several genres appears several times).
          Multiple artists are packed into one `;`-separated string.
        columns:
          - name: track_id
            description: Spotify track id.

  - name: muse_app
    schema: raw
    description: MUSE product data (simulated on top of the real catalog). Mimics app-database and event-stream exports.
    tables:
      - name: app_users
        description: Account table from the user service.
      - name: onboarding_genre_preferences
        description: Genres a listener picked during onboarding (≈85 % complete it).
      - name: subscriptions
        description: Subscription periods (freemium funnel). `ended_at` null = still active.
      - name: listening_events
        description: >
          Client event stream: play, skip, like, add_to_playlist, repeat. Delivered at-least-once
          (duplicate event_ids), from two SDK versions (two timestamp formats), sometimes days late
          (`ingested_at`), occasionally logged-out or pointing at tracks removed from the catalog.
