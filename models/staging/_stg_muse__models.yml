version: 2

models:
  - name: stg_muse__users
    description: One row per MUSE listener, with normalised country and plan.
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: subscription_plan
        data_tests:
          - accepted_values:
              arguments:
                values: ["free", "premium", "student"]

  - name: stg_muse__artists
    description: One row per artist.
    columns:
      - name: artist_id
        data_tests: [unique, not_null]
      - name: primary_genre
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_muse__genres')
                field: genre_name

  - name: stg_muse__genres
    description: Genre taxonomy.
    columns:
      - name: genre_name
        data_tests: [unique, not_null]
      - name: parent_genre
        data_tests: [not_null]

  - name: stg_muse__tracks
    description: One row per track, genre mapped to the canonical taxonomy.
    columns:
      - name: track_id
        data_tests: [unique, not_null]
      - name: artist_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_muse__artists')
                field: artist_id
      - name: genre_name
        description: Canonical genre. A null here means a raw label did not match the taxonomy.
        data_tests: [not_null]

  - name: stg_muse__user_genre_preferences
    description: Onboarding genre preferences, one row per user × genre.
    data_tests:
      - unique_combination:
          arguments:
            columns: ["user_id", "genre_name"]
    columns:
      - name: user_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_muse__users')
                field: user_id
      - name: affinity
        data_tests: [not_null, score_between_0_and_100]

  - name: stg_muse__listening_events
    description: Deduplicated listening events with normalised event types.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["play", "skip", "like", "repeat"]
      - name: user_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_muse__users')
                field: user_id
      - name: track_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_muse__tracks')
                field: track_id
