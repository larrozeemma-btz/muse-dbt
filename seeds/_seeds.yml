version: 2

seeds:
  - name: genre_families
    description: Hand-curated mapping of the 114 Spotify genres to 16 broader families (Pop, Rock, Electronic, ...).
    columns:
      - name: genre_name
        data_tests: [unique, not_null]
      - name: genre_family
        data_tests: [not_null]

  - name: channel_grouping_rules
    description: >
      Ordered rules turning raw utm_source / utm_medium into marketing channels
      (first matching rule wins, `*` matches anything). Keeping them as data lets
      marketing ops change the grouping without touching SQL.
    columns:
      - name: rule_order
        data_tests: [unique, not_null]
      - name: channel
        data_tests:
          - relationships:
              arguments:
                to: ref('marketing_channels')
                field: channel
  - name: marketing_channels
    description: The channel taxonomy shared by marketing, finance and sales.
    columns:
      - name: channel
        data_tests: [unique, not_null]
